name: Release

on:
  release:
    types:
      - published

jobs:
  publish-npm:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            bun install --frozen-lockfile --ignore-scripts
            bun run lint
            bun run typecheck
            bun run test
            bun run docs:check
            bun run build
            bun run format:write
            bun run format:check

      - name: Pack package
        id: pack
        uses: tanaabased/actions/npm-pack@v1

      - name: Test packed package
        run: bun run ./scripts/test-package.ts "${{ steps.pack.outputs.tarball-path }}"

      - name: Publish tested package
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          update-prerelease-tag-on-stable: true
          channel-token: ${{ secrets.TANAAB_NPM_DEPLOY }}

  publish-repo:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish release changes
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            bun install --frozen-lockfile --ignore-scripts
            bun run lint
            bun run typecheck
            bun run test
            bun run docs:check
            bun run build
            bun run format:write
            bun run format:check
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
