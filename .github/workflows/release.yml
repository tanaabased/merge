name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TERM: xterm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun run test

      - name: Export formatted release date
        run: echo "RELEASE_DATE=$(date -d "${{ github.event.release.published_at }}" "+%B %e, %Y" | tr -s ' ')" >> "$GITHUB_ENV"

      - name: Prepare release
        uses: tanaabased/prepare-release-action@v1
        with:
          commands: bun run format:write
          sync-verified: true
          update-files: CHANGELOG.md
          update-files-header: |
            ## {{ UNRELEASED_VERSION }} - [{{ UNRELEASED_DATE }}]({{ UNRELEASED_LINK }})
          update-files-meta: |
            UNRELEASED_DATE=${{ env.RELEASE_DATE }}
            UNRELEASED_LINK=${{ github.event.release.html_url }}
            UNRELEASED_VERSION=${{ github.event.release.tag_name }}

      - name: Build and validate release artifact
        run: |
          bun run format:check
          bun run build
          npm install --global npm@^11.5.1
          PACKAGE_TARBALL="$RUNNER_TEMP/$(npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP" --silent)"
          echo "PACKAGE_TARBALL=$PACKAGE_TARBALL" >> "$GITHUB_ENV"
          bun run ./scripts/test-package.ts "$PACKAGE_TARBALL"

      - name: Publish stable package
        if: ${{ github.event.release.prerelease == false }}
        run: |
          npm publish "$PACKAGE_TARBALL" --access public --dry-run
          npm publish "$PACKAGE_TARBALL" --access public

      - name: Publish prerelease package
        if: ${{ github.event.release.prerelease == true }}
        run: |
          npm publish "$PACKAGE_TARBALL" --access public --tag edge --dry-run
          npm publish "$PACKAGE_TARBALL" --access public --tag edge
